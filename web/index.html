<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptSnap — AI Prompt 管理与复用</title>
    <meta name="description" content="PromptSnap Web: 管理、搜索和复用你的 AI Prompt 模板集合。支持变量模板、分类筛选和一键复制。">
    <meta property="og:title" content="PromptSnap — AI Prompt 管理与复用">
    <meta property="og:description" content="管理、搜索和复用你的 AI Prompt 模板集合。">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Drop Overlay (拖拽导入) -->
    <div class="drop-overlay" id="drop-overlay">
        <div class="drop-content">
            <div class="drop-icon">📄</div>
            <div class="drop-text">释放文件以导入</div>
            <div class="drop-hint">支持 PromptSnap 备份的 JSON 文件</div>
        </div>
    </div>

    <!-- Modal Overlay (变量输入) -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">填写变量</h3>
                <p>填写下方变量后点击确认，Prompt 将自动复制到剪贴板。</p>
            </div>
            <div id="modal-body">
                <!-- 变量表单动态填充 -->
            </div>
            <div class="modal-footer">
                <button class="btn-modal-cancel" id="modal-cancel">取消</button>
                <button class="btn-modal-confirm" id="modal-confirm">确认并复制</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="header-top">
                <div class="logo">
                    <div class="logo-icon">⚡</div>
                    <span class="logo-text">PromptSnap</span>
                </div>
                <div class="header-actions">
                    <button class="btn-ghost" id="btn-sync-drive" title="从 Google Drive 同步最新备份">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                        </svg>
                        <span class="btn-text">Drive 同步</span>
                    </button>
                    <button class="btn-ghost" id="btn-import" title="导入 JSON 备份">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
                        </svg>
                        <span class="btn-text">导入</span>
                    </button>
                    <button class="btn-ghost" id="btn-clear-cache" title="清除本地缓存并重新加载">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg>
                        <span class="btn-text">刷新</span>
                    </button>
                    <input type="file" id="file-input" accept=".json" style="display: none;">
                </div>
            </div>

            <!-- Search -->
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
                <input
                    type="search"
                    class="search-input"
                    id="search-input"
                    placeholder="搜索 Prompt（标题、内容、分类）"
                    autocomplete="off"
                >
                <span class="search-shortcut">⌘K</span>
            </div>

            <!-- Stats -->
            <div class="stats-bar" id="stats-bar"></div>
        </header>

        <!-- Tags -->
        <div class="tags-bar" id="tags-bar">
            <!-- JS 渲染 -->
        </div>

        <!-- Card Grid -->
        <main class="card-grid" id="card-grid">
            <!-- JS 渲染 -->
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            PromptSnap Web · 你的 AI Prompt 效率工具
        </footer>
    </div>

    <!-- Scripts (注意加载顺序：依赖关系) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/gdrive.js"></script>
    <script src="js/store.js"></script>
    <script src="js/variables.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
