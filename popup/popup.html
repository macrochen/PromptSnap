<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 300px; padding: 0; margin: 0; font-family: 'Google Sans', sans-serif; }
        .header { padding: 16px; background: #f8f9fa; border-bottom: 1px solid #dadce0; display: flex; justify-content: space-between; align-items: center; }
        .title { font-weight: 500; font-size: 15px; color: #202124; }
        .btn-add { background: #1a73e8; color: white; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
        .btn-add:hover { background: #1557b0; }
        
        /* 筛选栏样式 */
        .tags-bar { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #f1f3f4; background: white; -webkit-overflow-scrolling: touch; }
        .tags-bar::-webkit-scrollbar { display: none; } /* 隐藏滚动条 */
        .tag { font-size: 12px; padding: 4px 12px; border-radius: 12px; background: #f1f3f4; color: #5f6368; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
        .tag:hover { background: #e8eaed; }
        .tag.active { background: #e8f0fe; color: #1a73e8; border-color: #d2e3fc; font-weight: 500; }

        .list { max-height: 400px; overflow-y: auto; }
        .item { padding: 12px 16px; border-bottom: 1px solid #f1f3f4; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.1s; }
        .item:hover { background: #f8f9fa; }
        .item-title { flex: 1; font-size: 14px; color: #202124; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; }
        
        .item-actions { display: flex; gap: 8px; opacity: 0.6; }
        .item:hover .item-actions { opacity: 1; }
        .icon-btn { cursor: pointer; padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: none; background: none; }
        .icon-btn:hover { background: #e8eaed; }
        .icon-edit { color: #1a73e8; }
        .icon-delete { color: #d93025; }
        
        /* 简单的 SVG 图标占位 */
        svg { width: 16px; height: 16px; fill: currentColor; }
        
        .empty { padding: 30px; text-align: center; color: #999; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <span class="title">PromptSnap</span>
        <button class="btn-add" id="btn-add">New</button>
    </div>
    <div class="tags-bar" id="tags-bar">
        <!-- JS 渲染分类标签 -->
    </div>
    <div class="list" id="list">
        <!-- JS 渲染列表 -->
    </div>
    <script src="popup.js"></script>
</body>
</html>
